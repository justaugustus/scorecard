name: goreleaser

on:
  push:
    tags:
      - "*" # triggers only if push new tag version, like `0.8.4` or else

permissions:
  contents: read

env:
  GO_VERSION: stable

jobs:
  goreleaser:
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: write  # for goreleaser/goreleaser-action to create a GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false # build releases from a clean cache
      - name: Configure ldflags
        id: ldflags
        run: echo "version_flags=$(./scripts/version-ldflags)" >> "$GITHUB_OUTPUT"
      - name: Run GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # keep in sync with github.com/goreleaser/goreleaser/v2 in tools/go.mod
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_LDFLAGS: ${{ steps.ldflags.outputs.version_flags }}
      - name: Generate subject
        id: hash
        env:
          ARTIFACTS: "${{ steps.run-goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail

          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          echo "hashes=$(cat $checksum_file | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    # Keep needs: the attester then starts after goreleaser finishes, so
    # the timeout clock and job-name matching can't race the build
    # (findings 7 and 11).
    needs: [goreleaser]
    permissions:
      id-token: write # sigstore keyless signing
      actions: read   # read the run's jobs
      contents: read  # read the repository
    uses: slsa-framework/actions/.github/workflows/attest_actions.yml@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
    with:
      # Required: publish and verification depend on this job, so
      # watching them would deadlock (finding 2).
      watch-jobs: goreleaser
      # goreleaser publishes straight to the release. No workflow
      # artifacts are uploaded.
      collect-artifacts: false
      release: ${{ github.ref_name }}
      # Archives plus scorecard_checksums.txt. This drops an
      # attestations.intoto.jsonl left by an earlier attempt
      # (finding 6).
      artifacts-filter: "scorecard_*"
      # Run the released, provenance-verified attester, not the
      # unpinned tip (finding 1).
      build-from-source: false
      version: v0.1.1

  publish:
    needs: [goreleaser, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the attestation to the release
    steps:
      - name: Download the attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slsa-attestations
      - name: Publish provenance to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv provenance.intoto.json attestations.intoto.jsonl
          gh release upload "$GITHUB_REF_NAME" attestations.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY"

  verification:
    needs: [goreleaser, publish]
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: Install the verifier
        uses: slsa-framework/actions/install/verifier@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
        with:
          version: v0.1.1

      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "*.tar.gz"
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "attestations.intoto.jsonl"

      - name: Verify assets
        env:
          CHECKSUMS: ${{ needs.goreleaser.outputs.hashes }}
          # The SHA in the uses: line above becomes the signer
          # identity's ref (migration-generator.md:280-282).
          SIGNER: "sigstore::https://token.actions.githubusercontent.com::https://github.com/slsa-framework/actions/.github/workflows/attest_actions.yml@3efdf6f2112b1170cb369442620788752df11bca"
        run: |
          set -euo pipefail
          # Pinning the builder to the tag ref is what binds the result to
          # this tag: verifier v0.1.1 skips expected_tag for attester
          # provenance. -v lists skipped controls so the run shows it.
          builder="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/goreleaser.yaml@${GITHUB_REF}"
          echo "$CHECKSUMS" | base64 -d | awk '{print $2}' | while read -r fn; do
            echo "Verifying $fn"
            slsa-verifier build attestations.intoto.jsonl "$fn" \
              --param "expected_source:github.com/${GITHUB_REPOSITORY}" \
              --param "expected_tag:${GITHUB_REF_NAME}" \
              --param "trusted_builders:[${builder}]" \
              --signer "$SIGNER" \
              --require-signatures --level 3 -v
          done
